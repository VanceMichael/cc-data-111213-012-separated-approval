<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>双人复核门户的角色隔离自动化</title><style>body{font:18px sans-serif;margin:24px}label,button{margin:8px}article[contenteditable]{min-height:160px;border:1px solid #888;padding:12px}canvas{display:block;border:1px solid #888}pre,output{white-space:pre-wrap}code{font-size:14px}.stale{color:#a33}.current{color:#176}</style><body><h1>资料制单与复核</h1><p><a href="/audit.html">只读审计页（新窗口打开）</a></p><label>演练身份<select id="user"><option value="maker-A">制单员甲</option><option value="reviewer-B">复核员乙</option></select></label><button id="login">登录</button><button id="logout" type="button">注销</button><output id="identity"></output><p id="version"></p><p>资料编号：<code id="payment-id"></code>　快照：<code id="snapshot"></code></p><p>规则结论：<output id="policy"></output></p><label>金额<input id="amount" type="number"></label><label>用途<input id="purpose" type="text" size="22"></label><p>附件 <code id="attachment"></code></p><button id="edit">保存资料</button><label><input id="confirm" type="checkbox">我已核对当前版本与快照</label><button id="approve">确认复核</button><button id="refresh">刷新资料</button><h2>复核意见</h2><pre id="opinions"></pre><h2>审计事件</h2><pre id="audit"></pre><p id="notice" role="status"></p><script type="module" src="/client.js"></script></body></html>
